{% extends "base.html" %}

{% block title %}Salary Access - Admin{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center p-6 bg-slate-50">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8">
        <div class="w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-5">
            <i class="fas fa-lock text-xl"></i>
        </div>
        <h1 class="text-xl font-black text-slate-900 text-center">Manage Salary</h1>
        <p class="text-sm text-slate-500 text-center mt-2 font-medium">Enter the payroll access password to continue.</p>

        <form method="post" action="{{ url_for('admin_salary_unlock') }}" class="mt-8 space-y-4">
            <div>
                <label for="salary-password" class="text-[11px] font-black text-slate-500 uppercase tracking-widest">Password</label>
                <input type="password" id="salary-password" name="password" required autofocus
                    class="mt-1 w-full px-4 py-3 rounded-xl border border-slate-200 font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
                    placeholder="Enter password" autocomplete="current-password">
            </div>
            <button type="submit"
                class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm transition-colors">
                <i class="fas fa-unlock-alt mr-1"></i> Unlock Manage Salary
            </button>
        </form>

        <a href="{{ url_for('admin_dashboard') }}"
            class="mt-6 block text-center text-sm font-bold text-slate-500 hover:text-slate-700">
            <i class="fas fa-arrow-left mr-1"></i> Back to dashboard
        </a>
    </div>
</div>
{% endblock %}
