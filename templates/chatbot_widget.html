<!-- Chatbot Widget -->
<div id="hrms-chatbot" class="hrms-chatbot" data-user-id="{{ current_user.id }}">
    <!-- Chat Bubble -->
    <div id="chatbot-bubble" class="chatbot-bubble" title="Tap: AI assistant · Long-press: move icon" role="button" aria-label="Open HRMS assistant. Long press to reposition.">
        <i class="fas fa-robot"></i>
        <span class="notification-badge"></span>
    </div>

    <!-- Chat Window -->
    <div id="chatbot-window" class="chatbot-window hidden">
        <div class="chatbot-header">
            <div class="header-info">
                <i class="fas fa-robot"></i>
                <div>
                    <h4>HRMS Assistant</h4>
                    <span class="status-online">Online</span>
                </div>
            </div>
            <button onclick="toggleChat()" class="close-btn">&times;</button>
        </div>
        
        <div id="chatbot-messages" class="chatbot-messages"></div>

        <div class="chatbot-input">
            <input type="text" id="chat-input" placeholder="Ask about leaves, schedule..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" id="send-btn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<style>
    :root {
        --chat-primary: #4a6cf7;
        --chat-bg: #ffffff;
        --chat-text: #333;
        --chat-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .hrms-chatbot {
        position: fixed;
        bottom: calc(30px + var(--fab-offset, 0px));
        right: 30px;
        z-index: 9999;
        font-family: 'Inter', sans-serif;
        transition: bottom 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (max-width: 640px) {
        .hrms-chatbot:not([data-fab-positioned]) {
            bottom: calc(1.25rem + var(--fab-offset, 0px));
            right: 1rem;
        }
        .chatbot-bubble {
            width: 52px;
            height: 52px;
            font-size: 22px;
        }
    }

    .chatbot-bubble {
        width: 60px;
        height: 60px;
        background: var(--chat-primary);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 24px;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(74, 108, 247, 0.4);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .chatbot-bubble:hover:not(.fab-is-dragging) {
        transform: scale(1.1);
    }
    .chatbot-bubble.fab-is-dragging,
    .fab-container-dragging.hrms-chatbot .chatbot-bubble {
        transform: scale(1.08);
        opacity: 0.92;
        cursor: grabbing;
        touch-action: none;
    }
    body.fab-drag-active {
        user-select: none;
        -webkit-user-select: none;
    }
    body.fab-drag-active .staff-chat-launcher,
    body.fab-drag-active .hrms-chatbot {
        touch-action: none;
    }

    .chatbot-window {
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 350px;
        height: 500px;
        background: var(--chat-bg);
        border-radius: 20px;
        box-shadow: var(--chat-shadow);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: all 0.3s ease;
        border: 1px solid rgba(0,0,0,0.05);
    }

    .chatbot-window.hidden {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
        pointer-events: none;
    }

    /* Hide chatbot on full-screen staff chat page only */
    body.staff-chat-fullpage .hrms-chatbot {
        display: none;
    }

    .chatbot-header {
        background: var(--chat-primary);
        color: white;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header-info {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .header-info h4 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
    }

    .status-online {
        font-size: 11px;
        opacity: 0.8;
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .status-online::before {
        content: '';
        width: 6px;
        height: 6px;
        background: #4ade80;
        border-radius: 50%;
        display: inline-block;
    }

    .close-btn {
        background: none;
        border: none;
        color: white;
        font-size: 24px;
        cursor: pointer;
        opacity: 0.7;
    }

    .chatbot-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #f8fafc;
    }

    .message {
        max-width: 85%;
        padding: 10px 15px;
        border-radius: 15px;
        font-size: 14px;
        line-height: 1.5;
    }

    .message.system {
        align-self: flex-start;
        background: #e2e8f0;
        color: #475569;
        border-bottom-left-radius: 2px;
    }

    .message.user {
        align-self: flex-end;
        background: var(--chat-primary);
        color: white;
        border-bottom-right-radius: 2px;
    }

    .message.ai {
        align-self: flex-start;
        background: white;
        color: var(--chat-text);
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        border-bottom-left-radius: 2px;
        border: 1px solid #edf2f7;
    }

    .chatbot-input {
        padding: 15px;
        display: flex;
        gap: 10px;
        background: white;
        border-top: 1px solid #edf2f7;
    }

    .chatbot-input input {
        flex: 1;
        border: 1px solid #e2e8f0;
        padding: 10px 15px;
        border-radius: 10px;
        outline: none;
        font-size: 14px;
    }

    .chatbot-input input:focus {
        border-color: var(--chat-primary);
    }

    .chatbot-input button {
        background: var(--chat-primary);
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.2s;
    }

    .chatbot-input button:hover {
        opacity: 0.9;
    }

    .typing-indicator {
        font-style: italic;
        color: #94a3b8;
        font-size: 12px;
        margin-bottom: 5px;
    }

    /* Scrollbar */
    .chatbot-messages::-webkit-scrollbar {
        width: 4px;
    }
    .chatbot-messages::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
    }

    /* Mobile Responsive - Half Screen Look */
    @media (max-width: 640px) {
        /* Match staff chat launcher vertical alignment on mobile */
        .hrms-chatbot {
            bottom: 1.25rem;
            right: 1rem;
        }

        .chatbot-bubble {
            width: 52px;
            height: 52px;
            font-size: 22px;
        }

        .chatbot-window {
            position: fixed;
            top: auto;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 60%;
            max-height: 500px;
            border-radius: 30px 30px 0 0;
            z-index: 10001;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
        }
        
        .chatbot-window.hidden {
            transform: translateY(100%);
            opacity: 0;
        }
        
        .chatbot-header {
            padding: 15px 25px;
            height: auto;
            border-radius: 30px 30px 0 0;
        }

        .chatbot-messages {
            height: calc(100% - 130px);
        }
    }

</style>

<script>
    function toggleChat() {
        const chatWin = document.getElementById('chatbot-window');
        chatWin.classList.toggle('hidden');
        if (!chatWin.classList.contains('hidden')) {
            document.getElementById('chat-input').focus();
        }
    }
    window.toggleHrmsChatbot = toggleChat;

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    // --- Session-only storage: fast reload in same tab; cleared on login (not after logout/re-login) ---
    const CHAT_STORAGE_VER = 'v3';
    const CHAT_HISTORY_MAX = 50;
    const CHAT_CACHE_MAX = 40;
    const CHAT_CACHE_TTL_MS = 24 * 60 * 60 * 1000;
    const CHAT_HISTORY_TTL_MS = 12 * 60 * 60 * 1000;
    const DEFAULT_GREETING = "Hi {{ current_user.name }}! I'm your HRMS teammate. How can I help you on this {{ (request.endpoint or 'unknown').split('.')[-1].replace('_', ' ') }} page?";

    const chatWidget = document.getElementById('hrms-chatbot');
    let chatMessages = [];
    let chatFetchController = null;

    function chatStorageKeys() {
        const uid = chatWidget?.dataset?.userId || 'guest';
        const base = `hrms-chat-${CHAT_STORAGE_VER}-${uid}`;
        return {
            history: `${base}-history`,
            cache: `${base}-cache`
        };
    }

    function clearLegacyChatLocalStorage() {
        try {
            const drop = [];
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.startsWith('hrms-chat-')) drop.push(k);
            }
            drop.forEach((k) => localStorage.removeItem(k));
        } catch (e) { /* ignore */ }
    }

    function normalizeCacheKey(text) {
        let k = String(text || '').trim().toLowerCase().replace(/\s+/g, ' ');
        if (/^h+i+!*$/.test(k)) k = 'hi';
        if (/^he+l+o+!*$/.test(k)) k = 'hello';
        if (/^hey+!*$/.test(k)) k = 'hey';
        return k;
    }

    function isPortableCacheKey(key) {
        if (!key) return false;
        if (key.length <= 24) return true;
        return /^(hi|hello|hey|thanks|thank you|ok|okay|bye|good morning|good evening|help)$/.test(key);
    }

    function pageFingerprint() {
        return window.location.pathname || '/';
    }

    function historyPayload() {
        return {
            messages: chatMessages.slice(-CHAT_HISTORY_MAX),
            updatedAt: Date.now(),
            page: pageFingerprint()
        };
    }

    function persistChatHistory() {
        const payload = historyPayload();
        try {
            sessionStorage.setItem(chatStorageKeys().history, JSON.stringify(payload));
        } catch (e) {
            console.warn('Chat history save failed', e);
        }
    }

    function loadChatHistory() {
        const keys = chatStorageKeys();
        try {
            const raw = sessionStorage.getItem(keys.history);
            if (!raw) return null;
            const data = JSON.parse(raw);
            if (!data?.messages?.length) return null;
            if (Date.now() - (data.updatedAt || 0) > CHAT_HISTORY_TTL_MS) {
                sessionStorage.removeItem(keys.history);
                return null;
            }
            return data;
        } catch (e) {
            try { sessionStorage.removeItem(keys.history); } catch (err) { /* ignore */ }
            return null;
        }
    }

    function loadResponseCache() {
        try {
            const raw = sessionStorage.getItem(chatStorageKeys().cache);
            if (!raw) return { entries: {} };
            const parsed = JSON.parse(raw);
            if (Date.now() - (parsed.updatedAt || 0) > CHAT_CACHE_TTL_MS) {
                sessionStorage.removeItem(chatStorageKeys().cache);
                return { entries: {} };
            }
            return parsed;
        } catch (e) {
            return { entries: {} };
        }
    }

    function saveResponseCache(entries) {
        try {
            const keys = Object.keys(entries);
            while (keys.length > CHAT_CACHE_MAX) {
                const oldest = keys.sort((a, b) => (entries[a].ts || 0) - (entries[b].ts || 0))[0];
                delete entries[oldest];
            }
            sessionStorage.setItem(chatStorageKeys().cache, JSON.stringify({ entries, updatedAt: Date.now() }));
        } catch (e) {
            console.warn('Chat cache save failed', e);
        }
    }

    function getCachedResponse(message) {
        const key = normalizeCacheKey(message);
        if (!key) return null;
        const store = loadResponseCache();
        const hit = store.entries?.[key];
        if (!hit?.text) return null;
        if (Date.now() - (hit.ts || 0) > CHAT_CACHE_TTL_MS) return null;
        if (!isPortableCacheKey(key) && hit.page && hit.page !== pageFingerprint()) return null;
        return hit.text;
    }

    function setCachedResponse(message, text) {
        const key = normalizeCacheKey(message);
        if (!key || !text) return;
        const store = loadResponseCache();
        store.entries = store.entries || {};
        store.entries[key] = {
            text,
            ts: Date.now(),
            page: pageFingerprint(),
            portable: isPortableCacheKey(key)
        };
        saveResponseCache(store.entries);
    }

    function normalizeMessageText(value) {
        if (value == null) return '';
        if (typeof value === 'string') return value;
        if (typeof value === 'number' || typeof value === 'boolean') return String(value);
        if (Array.isArray(value)) return value.map(normalizeMessageText).filter(Boolean).join(' ');
        if (typeof value === 'object') {
            // Handle common legacy payload shapes before generic stringify.
            if (typeof value.text === 'string') return value.text;
            if (typeof value.message === 'string') return value.message;
            if (typeof value.content === 'string') return value.content;
            try { return JSON.stringify(value); } catch (e) { return String(value); }
        }
        return String(value);
    }

    function appendMessage(text, sender, persist = true) {
        const safeText = normalizeMessageText(text);
        const messagesDiv = document.getElementById('chatbot-messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = safeText;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        if (persist) {
            const role = sender === 'user' ? 'user' : (sender === 'system' ? 'system' : 'ai');
            chatMessages.push({ role, text: safeText, ts: Date.now() });
            persistChatHistory();
        }
    }

    function createAiMessageBubble() {
        const messagesDiv = document.getElementById('chatbot-messages');
        const aiMsgDiv = document.createElement('div');
        aiMsgDiv.className = 'message ai';
        const aiContent = document.createElement('span');
        aiMsgDiv.appendChild(aiContent);
        messagesDiv.appendChild(aiMsgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        return aiContent;
    }

    function recentContextForApi() {
        return chatMessages
            .filter((m) => m.role === 'user' || m.role === 'ai')
            .slice(-8)
            .map((m) => ({ role: m.role, text: normalizeMessageText(m.text) }));
    }

    async function fetchAiReply(message, aiContent) {
        if (chatFetchController) chatFetchController.abort();
        chatFetchController = new AbortController();
        let fullResponse = '';

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal: chatFetchController.signal,
                body: JSON.stringify({
                    message: message,
                    page: window.location.pathname,
                    history: recentContextForApi()
                })
            });

            if (!response.ok) throw new Error('Network response was not ok');

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            aiContent.innerHTML = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                for (const line of chunk.split('\n')) {
                    if (!line.startsWith('data: ')) continue;
                    try {
                        const data = JSON.parse(line.substring(6));
                        if (data.text) {
                            fullResponse += data.text;
                            aiContent.innerText = fullResponse;
                            document.getElementById('chatbot-messages').scrollTop =
                                document.getElementById('chatbot-messages').scrollHeight;
                        } else if (data.error) {
                            fullResponse = 'Error: ' + data.error;
                            aiContent.innerText = fullResponse;
                        }
                    } catch (e) {
                        console.error('Error parsing stream line', e);
                    }
                }
            }

            if (fullResponse) {
                setCachedResponse(message, fullResponse);
                chatMessages.push({ role: 'ai', text: fullResponse, ts: Date.now() });
                persistChatHistory();
            }
        } catch (error) {
            if (error.name === 'AbortError') return;
            console.error('Chat Error:', error);
            fullResponse = 'Connection lost. Please restart server and refresh.';
            aiContent.innerText = fullResponse;
            chatMessages.push({ role: 'ai', text: fullResponse, ts: Date.now() });
            persistChatHistory();
        } finally {
            chatFetchController = null;
        }
    }

    async function deliverAiReply(message) {
        const cached = getCachedResponse(message);
        const aiContent = createAiMessageBubble();

        if (cached) {
            aiContent.innerText = cached;
            chatMessages.push({ role: 'ai', text: cached, ts: Date.now(), cached: true });
            persistChatHistory();
            return;
        }

        aiContent.innerHTML = '<i>Thinking...</i>';
        await fetchAiReply(message, aiContent);
    }

    function restoreChatFromStorage() {
        const saved = loadChatHistory();
        const messagesDiv = document.getElementById('chatbot-messages');
        if (!messagesDiv) return;

        messagesDiv.innerHTML = '';

        if (saved?.messages?.length) {
            chatMessages = saved.messages.slice(-CHAT_HISTORY_MAX);
            chatMessages.forEach((m) => {
                const sender = m.role === 'user' ? 'user' : (m.role === 'system' ? 'system' : 'ai');
                const cleanText = normalizeMessageText(m.text);
                m.text = cleanText;
                appendMessage(cleanText, sender, false);
            });
        } else {
            chatMessages = [{ role: 'system', text: DEFAULT_GREETING, ts: Date.now() }];
            appendMessage(DEFAULT_GREETING, 'system', false);
            persistChatHistory();
        }

        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        resumePendingReplyIfNeeded();
    }

    async function resumePendingReplyIfNeeded() {
        if (!chatMessages.length) return;
        const last = chatMessages[chatMessages.length - 1];
        if (last.role !== 'user') return;

        const cached = getCachedResponse(last.text);
        if (cached) {
            appendMessage(cached, 'ai');
            return;
        }

        await deliverAiReply(last.text);
    }

    clearLegacyChatLocalStorage();
    restoreChatFromStorage();

    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (!message) return;

        appendMessage(message, 'user');
        input.value = '';
        await deliverAiReply(message);
    }
</script>
