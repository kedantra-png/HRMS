<!-- Staff messaging launcher (separate from AI chatbot) -->
<a href="{{ url_for('staff_chat_page') }}" id="staff-chat-launcher" class="staff-chat-launcher" title="Tap: Staff chat · Long-press: move icon" aria-label="Open staff chat. Long press to reposition.">
    <i class="fab fa-whatsapp"></i>
    <span id="staff-chat-badge" class="staff-chat-badge hidden">0</span>
</a>

<style>
    @keyframes staff-chat-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
    }
    .staff-chat-launcher {
        position: fixed;
        bottom: calc(30px + var(--fab-offset, 0px));
        left: 30px;
        z-index: 9998;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        box-shadow: 0 6px 20px rgba(37, 211, 102, 0.45);
        transition: bottom 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s, box-shadow 0.2s;
        text-decoration: none;
        animation: staff-chat-float 3.2s ease-in-out infinite;
    }
    .staff-chat-launcher:hover:not(.fab-is-dragging) {
        transform: scale(1.06);
        box-shadow: 0 8px 28px rgba(37, 211, 102, 0.55);
        color: #fff;
    }
    .staff-chat-launcher.fab-is-dragging,
    .staff-chat-launcher.fab-footer-lifted,
    .fab-container-dragging.staff-chat-launcher {
        animation: none !important;
        z-index: 10002;
    }
    .staff-chat-launcher.fab-is-dragging,
    .fab-container-dragging.staff-chat-launcher {
        transform: scale(1.08);
        opacity: 0.92;
        cursor: grabbing;
        touch-action: none;
    }
    .staff-chat-badge {
        position: absolute;
        top: -2px;
        right: -2px;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        border-radius: 10px;
        background: #ef4444;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #fff;
    }
    .staff-chat-badge.hidden { display: none; }
    @media (max-width: 640px) {
        .staff-chat-launcher:not([data-fab-positioned]) {
            bottom: calc(1.25rem + var(--fab-offset, 0px));
            left: 1rem;
        }
        .staff-chat-launcher {
            width: 52px;
            height: 52px;
            font-size: 24px;
        }
    }
    body.staff-chat-fullpage .staff-chat-launcher { display: none; }
</style>

<script>
(function () {
    const badge = document.getElementById('staff-chat-badge');
    if (!badge) return;

    async function refreshUnread() {
        try {
            const res = await fetch('/api/staff-chat/unread-count');
            if (!res.ok) return;
            const data = await res.json();
            const n = data.count || 0;
            if (n > 0) {
                badge.textContent = n > 99 ? '99+' : n;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        } catch (e) { /* ignore */ }
    }

    refreshUnread();
    if (typeof socket !== 'undefined') {
        socket.on('staff_chat_message', function (data) {
            const myId = '{{ current_user.id }}';
            if (data.sender_id !== myId) refreshUnread();
        });
    }
    setInterval(refreshUnread, 60000);
})();
</script>
<script src="{{ url_for('static', filename='js/hrms_fab_drag.js') }}"></script>
